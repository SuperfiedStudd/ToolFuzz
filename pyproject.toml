[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolfuzz"
version = "0.1.0"
description = "An adversarial reliability testing framework for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff",
]
gemini = [
  "google-genai>=1.0",
]
openai = [
  "openai>=1.0",
]
anthropic = [
  "anthropic>=0.40",
]
providers = [
  "google-genai>=1.0",
  "openai>=1.0",
  "anthropic>=0.40",
]

[project.scripts]
toolfuzz = "toolfuzz.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["toolfuzz*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
